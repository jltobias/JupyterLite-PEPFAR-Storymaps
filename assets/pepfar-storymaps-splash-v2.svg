<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">PEPFAR StoryMaps: people, place, and hope</title>
  <desc id="desc">Original HIV awareness ribbon beside PEPFAR StoryMaps lettering, an illustrative key populations map, and a Stories of Hope card. The map does not show real data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf3f9"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#06386f"/><stop offset="1" stop-color="#0b5590"/></linearGradient>
    <linearGradient id="red" x2="1" y2="1"><stop stop-color="#ed3650"/><stop offset="1" stop-color="#b71938"/></linearGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#9eb5cc" stroke-opacity=".32"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#123b5b" flood-opacity=".13"/></filter>
    <clipPath id="map"><rect x="814" y="193" width="688" height="253" rx="14"/></clipPath>
  </defs>
  <rect width="1600" height="680" rx="24" fill="url(#bg)"/>
  <rect width="16" height="680" rx="8" fill="#d62645"/>
  <path d="M0 642H1600" stroke="#d8e5f0" stroke-width="2"/>

  <!-- Original awareness-ribbon artwork; no official PEPFAR mark is reproduced. -->
  <circle cx="137" cy="126" r="72" fill="#fff0f2"/>
  <g transform="translate(99 69)">
    <path d="M37 13C23-6 3 7 8 28c5 22 30 48 58 83l15-11C51 63 31 40 28 27c-2-10 6-15 13-7z" fill="url(#red)"/>
    <path d="M42 15C58-7 85 4 77 29 71 49 50 73 22 110L7 99C37 60 55 39 58 26c3-11-7-16-14-6z" fill="#d62645"/>
    <path d="M29 75c5-7 12-16 17-23l15 18-16 18z" fill="#a51131" opacity=".62"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="235" y="111" font-size="20" font-weight="700" letter-spacing="3" fill="#a91c3c">GLOBAL HIV RESPONSE</text>
    <text x="235" y="146" font-size="17" font-weight="700" letter-spacing="1.4" fill="#52718c">PEOPLE  /  PLACE  /  TIME</text>
    <text x="73" y="295" font-size="86" font-weight="800" letter-spacing="-3" fill="#08396f">PEPFAR</text>
    <text x="73" y="381" font-size="82" font-weight="700" letter-spacing="-3" fill="#0b5590">StoryMaps</text>
    <rect x="75" y="411" width="92" height="7" rx="3.5" fill="#d62645"/>
    <text x="75" y="476" font-size="28" fill="#254b6e">Explore the global HIV response</text>
    <text x="75" y="515" font-size="28" fill="#254b6e">through maps, evidence, and lives.</text>
    <g font-size="17" font-weight="700" letter-spacing="1.2" fill="#4e6880">
      <circle cx="82" cy="591" r="6" fill="#d62645"/><text x="101" y="597">HISTORY</text>
      <circle cx="238" cy="591" r="6" fill="#d62645"/><text x="257" y="597">DATA</text>
      <circle cx="350" cy="591" r="6" fill="#d62645"/><text x="369" y="597">HUMAN STORIES</text>
    </g>
  </g>

  <!-- Atlas-style visual framing; all map marks are schematic. -->
  <rect x="783" y="67" width="752" height="391" rx="20" fill="#fff" filter="url(#shadow)"/>
  <path d="M803 67h712a20 20 0 0 1 20 20v84H783V87a20 20 0 0 1 20-20z" fill="url(#blue)"/>
  <circle cx="823" cy="103" r="6" fill="#ed5367"/><circle cx="844" cy="103" r="6" fill="#f6c5cc"/><circle cx="865" cy="103" r="6" fill="#a9cde9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="812" y="144" font-size="28" font-weight="700">KEY POPULATIONS ATLAS</text>
    <text x="1318" y="140" font-size="15" font-weight="700" letter-spacing="1.2" fill="#d4e7f7">PEOPLE · PLACE · TIME</text>
  </g>
  <text x="815" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b7690">Schematic map · locations and dots are illustrative, not HIV data</text>
  <rect x="814" y="193" width="688" height="253" rx="14" fill="#eaf2fa"/>
  <g clip-path="url(#map)">
    <rect x="814" y="193" width="688" height="253" fill="url(#grid)"/>
    <g fill="#b7cde0" stroke="#f7fbfe" stroke-width="2" stroke-linejoin="round">
      <path d="M855 243l24-18 38-8 33 9 15 23-15 13-16-2-8 18-25 3-13 23-25-12-16-29z"/>
      <path d="M938 310l24 4 16 25-7 38-17 36-19 9-8-31-14-21 4-35z"/>
      <path d="M1002 234l16-20 38-8 27 10 16-7 39 11 27-4 39 20 42-2 42 20-4 19-39 1-20 18-29-8-21 13-28-10-16 9-22-16-19 5-11-18-27-7z"/>
      <path d="M1085 294l37 6 23 23-4 40-21 27-12 36-20-21-20-41 1-38z"/>
      <path d="M1297 358l29-11 28 7 15 18-10 29-33 7-27-20z"/>
      <path d="M990 204l14-13 19 4-8 17-15 5z"/>
      <path d="M963 284l13 3 7 10-10 7-13-9z"/>
    </g>
    <g fill="#d82746" opacity=".83"><circle cx="1105" cy="325" r="11"/><circle cx="1129" cy="356" r="8"/><circle cx="1053" cy="262" r="8"/><circle cx="1192" cy="277" r="10"/><circle cx="966" cy="291" r="7"/><circle cx="1321" cy="378" r="7"/></g>
    <g fill="none" stroke="#d82746" stroke-opacity=".48" stroke-width="2"><circle cx="1105" cy="325" r="19"/><circle cx="1192" cy="277" r="18"/><circle cx="966" cy="291" r="15"/></g>
    <rect x="1197" y="293" width="278" height="145" rx="14" fill="#fff" opacity=".97"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="1215" y="318" font-size="17" font-weight="700" fill="#0a477c">EXPLORE BY COMMUNITY</text>
      <g font-size="15" fill="#294c68">
        <circle cx="1221" cy="337" r="4" fill="#d62645"/><text x="1232" y="342">Sex workers</text>
        <circle cx="1221" cy="358" r="4" fill="#d62645"/><text x="1232" y="363">Gay men &amp; other MSM</text>
        <circle cx="1221" cy="379" r="4" fill="#d62645"/><text x="1232" y="384">People who inject drugs</text>
        <circle cx="1221" cy="400" r="4" fill="#d62645"/><text x="1232" y="405">Transgender people</text>
        <circle cx="1221" cy="421" r="4" fill="#d62645"/><text x="1232" y="426">People in prisons</text>
      </g>
    </g>
  </g>

  <rect x="783" y="476" width="752" height="128" rx="20" fill="#fff" filter="url(#shadow)"/>
  <rect x="783" y="476" width="12" height="128" rx="6" fill="#d62645"/>
  <circle cx="856" cy="540" r="39" fill="#fff0f2"/>
  <path d="M840 545c0-10 8-17 17-17s17 7 17 17c0 12-17 23-17 23s-17-11-17-23z" fill="none" stroke="#d62645" stroke-width="4"/>
  <circle cx="857" cy="542" r="6" fill="#d62645"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="917" y="530" font-size="28" font-weight="700" fill="#08396f">STORIES OF HOPE</text>
    <text x="917" y="563" font-size="20" fill="#476681">People and communities behind the response</text>
  </g>
  <path d="M1482 537h20m-8-8 8 8-8 8" fill="none" stroke="#d62645" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
