<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">PEPFAR StoryMaps</title>
  <desc id="description">An original illustration of a connected globe, a timeline, and data charts for exploring the global HIV response.</desc>
  <defs>
